name: Build and Package iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build AuraWall IPA on macOS
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 15/16
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Verify Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build iOS App with Xcode
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project AuraWall/AuraWall.xcodeproj \
            -scheme AuraWall \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Save Error Log on Failure
        if: failure()
        run: |
          echo "=== BUILD ERROR ===" > BUILD_ERROR.txt
          grep -E "error:|fatal error:|FAILED" build.log -B 2 -A 3 >> BUILD_ERROR.txt || tail -n 80 build.log >> BUILD_ERROR.txt
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add BUILD_ERROR.txt
          git commit -m "chore: record build error [skip ci]" || true
          git push origin main || true

      - name: Package App into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/AuraWall.app build/Payload/
          cd build
          zip -r AuraWall.ipa Payload
          cd ..
          ls -lh build/AuraWall.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraWall-IPA
          path: build/AuraWall.ipa
          retention-days: 30

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: AuraWall AI iOS IPA Build #${{ github.run_number }}
          body: |
            ## 📱 AuraWall AI — Hazır iOS IPA Dosyası
            
            Bu IPA dosyası buluttaki macOS-14 ortamında otomatik olarak derlendi.
            
            ### 🚀 Telefona Nasıl Yüklenir?
            1. Aşağıdaki **AuraWall.ipa** dosyasını indirin.
            2. Bilgisayarınızda **Sideloadly** veya **AltStore** programını açın.
            3. iPhone'unuzu kabloyla bilgisayara bağlayın.
            4. `AuraWall.ipa` dosyasını Sideloadly'ye sürükleyin ve **Start** butonuna basın.
            5. Uygulama birkaç saniye içinde iPhone'unuza yüklenecektir!
          files: build/AuraWall.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
